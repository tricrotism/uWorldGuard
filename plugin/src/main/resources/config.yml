# uWorldGuard configuration.
# /uwg reload applies everything here except `storage` and `compatibility`, which need a restart.

storage:
    # yaml: one file per world. The right choice for almost every server.
    # sql:  one SQLite database. Needs `sql.enabled: true` too. It is not faster than yaml, so only
    #       pick it if you want the data in a database.
    # On UniverseSpigot, regions live in the server's own region service and this backend keeps a
    # backup copy of every save.
    type: yaml
    # Minutes between saves. Saves run off the main thread and only touch worlds that changed.
    #   Lower:  less lost if the server crashes, more disk writes.
    #   Higher: fewer writes, more lost on a crash.
    #   0:      save only on shutdown and world unload. A crash loses every edit since boot.
    auto-save-minutes: 5
    # Seconds the shutdown save waits for worlds that were unloaded just before and are still saving.
    unload-save-wait-seconds: 10
    sql:
        enabled: false
        url: "jdbc:sqlite:plugins/uWorldGuard/regions.db"
        user: ""
        password: ""
        # Seconds to wait for a MySQL or MariaDB server to answer before giving up, so an
        # unreachable database fails startup quickly instead of hanging it. 0 leaves it to the
        # driver. Ignored for SQLite, and when the URL already sets connectTimeout.
        connect-timeout-seconds: 10

selection:
    # Selection wand item when WorldEdit is not installed. With WorldEdit, its wand is used instead.
    wand-item: WOODEN_AXE

# Blocks players may still right-click in regions that deny `interact`/`use`, e.g. NOTE_BLOCK.
# Only that blanket check is skipped. Specific flags (chest-access, use-anvil, lectern, sign-edit,
# ...) still apply. Uses Bukkit material names, unknown names are logged and ignored. No
# performance cost either way.
interaction:
    whitelist: [ ]
    #whitelist:
    #    - NOTE_BLOCK
    #    - ANVIL

# Items and blocks restricted everywhere, region or not, as WorldGuard's blacklist does. Entries here
# apply in every world. A world's own entries go under worlds.<name>.blacklist (see below) and add to
# these. Also editable in game with /uwg blacklist.
#   items:          materials the entry covers (lava_bucket, tnt, ...).
#   on-<rule>:      what to do. Rules: on-break, on-place, on-interact, on-use, on-drop, on-acquire
#                   (pick up or take from an inventory), on-equip, on-destroy-with (break a block while
#                   holding it), on-dispense.
#                   Actions: deny, allow, tell (tell the player), notify (staff with
#                   uworldguard.blacklist.notify), log, kick, ban.
#   ignore-perms:   players with any of these permissions are left alone.
#   ignore-groups:  same, by group. Checked as the permission group.<name>, which LuckPerms grants.
#   message:        text for tell, kick and ban instead of the defaults in messages.yml. MiniMessage,
#                   <item> and <action> are filled in.
#   comment:        shown to staff and written to the log.
# Each player is told, notified about and logged at most once per rule every 3 seconds. Refusing
# still happens every time.
blacklist:
    # true: a listed item refuses every rule that does not say allow. Unlisted items are left alone.
    use-as-whitelist: false
    logging:
        console: true
        # Daily files in plugins/uWorldGuard/logs/, written in the background.
        file: true
    entries: [ ]
    #entries:
    #    - items: [ lava_bucket, water_bucket ]
    #      ignore-perms: [ spawn.builder ]
    #      ignore-groups: [ admin ]
    #      on-use: [ deny, tell, log ]
    #      message: "<red>No buckets here."
    #    - items: [ tnt ]
    #      on-place: [ deny, notify, kick ]
    #      comment: "TNT"

# How entering and leaving regions is detected. This is uWorldGuard's busiest work.
movement:
    # EVENT: checks every player movement.
    #   + Exact. Denied entry/exit is blocked before the player moves, greetings are instant.
    #   - Cost grows with how much players move. Busy servers feel this most.
    # TASK: checks each player every `task-interval-ticks` instead.
    #   + Cost depends on player count only, cheaper and steadier under load.
    #   - A denied crossing teleports the player back after the fact (brief rubber-band).
    #   - Greetings and effects can lag by up to one interval.
    #   - Crossing a region and back within one interval is not seen.
    #   Also moves anyone standing where they are not allowed about once a second, which covers
    #   logging in inside a no-entry region.
    # Pick TASK on large or laggy servers, EVENT when exact borders matter.
    mode: EVENT
    # TASK only. Lower is more responsive, higher is cheaper. 4 (0.2s) is a good balance, 1 gives
    # up most of the saving.
    task-interval-ticks: 4

# Per-world overrides.
#   events:      Bukkit events uWorldGuard ignores in that world, matched by class name
#                (BlockBreakEvent, PlayerInteractEvent, ...). Ignored events cost almost nothing, so
#                this is a real saving in minigame or creative worlds another plugin manages.
#                whitelist-mode: true flips it to "handle only the listed events".
#   interaction: extra whitelisted blocks for that world, added to the global list above.
#   blacklist:   entries for that world, added to the global ones, and its own use-as-whitelist.
#worlds:
#    minigames:
#        interaction:
#            whitelist:
#                - NOTE_BLOCK
#        blacklist:
#            use-as-whitelist: false
#            entries:
#                - items: [ elytra ]
#                  on-equip: [ deny, tell ]
#        events:
#            whitelist-mode: false
#            disabled:
#                - BlockBreakEvent
#                - BlockPlaceEvent
#                - PlayerInteractEvent
#                - EntityDamageEvent
#                - EntityDamageByEntityEvent

# Checks for a newer release once at startup, off the main thread. Silent when up to date or offline.
updates:
    check: true

# Extra console notes for bug reports: flag name clashes with other plugins, calls to WorldGuard
# API members uWorldGuard does not implement, per-world region notes. Changes nothing, and real
# problems are always logged. Leave off unless you are reporting a bug.
logging:
    verbose: false

regions:
    # true:  owners and members can build in their region, flags restrict everyone else. This is
    #        how WorldGuard works and what almost every server wants.
    # false: only flags decide. Member lists are kept but ignored, so a region without a build flag
    #        denies everyone, its owner included. Turning it back on restores the lists as they were.
    membership-grants-trust: true
    # true:  a player standing where pvp is denied to them cannot place, break, use, hit or shoot
    #        into a region that sets pvp to allow, so a safezone is not a safe spot to fight from.
    # false: only the region being acted on decides, as in WorldGuard.
    safezone-isolation: true
    # true:  a player who jumps and places a refused block under their feet is pushed back down,
    #        so the block their client briefly shows cannot be used to climb on air.
    # false: the block is refused but the player keeps whatever height the client gave them.
    stop-ghost-climb: true

# Version uWorldGuard reports to other plugins. Some plugins (BetonQuest, PvPManager, ...) only hook
# into WorldGuard 7+, so by default uWorldGuard reports the WorldGuard version it emulates.
#   "":     report the emulated WorldGuard version. Keeps those hooks working.
#   "none": report uWorldGuard's own version. Those plugins may then refuse to hook.
#   "7.x.y": report a specific version. Use a real WorldGuard release.
# The update checker, bStats and spark always see the real version.
compatibility:
    report-version: ""
